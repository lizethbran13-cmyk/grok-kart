<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;overflow:hidden}canvas{width:100vw;height:100vh;display:block}</style>
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js", "three/addons/": "./lib/addons/" } }</script></head><body><canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { initEngine, setEnvironment, render, followShadow, E } from './js/engine.js';
import { TRACKS, CHARS, BODIES, WHEELS, PAINTS } from './js/data.js';
import { buildTrackData, pointAt } from './js/track.js';
import { buildWorld } from './js/world.js';
import { THEMES } from './js/themes.js';
import { makeKart, animateKart } from './js/models.js';
const q = new URLSearchParams(location.search); const tid = q.get('t') || 'city', u = +(q.get('u') || 0.02);
initEngine(document.getElementById('c'), q.get('q') || 'high');
const T = TRACKS.find(t => t.id === tid); const D = buildTrackData(T); setEnvironment(THEMES[T.theme].env); const W = buildWorld(D, E.scene, 'high');
const ks = []; for (let i = 0; i < 6; i++) { const c = CHARS[i % CHARS.length]; const K = makeKart({ char: c.id, body: BODIES[i % BODIES.length].id, wheels: WHEELS[i % WHEELS.length].id, paint: PAINTS[i * 2 % PAINTS.length], glider: 'chute' }); E.scene.add(K.root);
  const p = pointAt(D, u * D.L + 8 + (i >> 1) * 6, (i % 2 ? 1 : -1) * 3); animateKart(K, { x: p.x, y: p.y, z: p.z, yaw: p.yaw, speed: 0, steer: 0, boost: i == 0 ? 1 : 0, boostLvl: 2 }, 0.016, 0); ks.push(K); }
const cp = pointAt(D, u * D.L - 4, 0); const lp = pointAt(D, u * D.L + 18, 0);
E.camera.position.set(cp.x, cp.y + 4.5, cp.z); E.camera.lookAt(lp.x, lp.y + 1, lp.z); E.camera.fov = 70; E.camera.updateProjectionMatrix();
followShadow(lp.x, lp.y, lp.z);
let t = 0; function loop() { t += 0.016; W.anim.forEach(f => f(0.016, t)); render(0.016); requestAnimationFrame(loop); } loop(); window.ready = true;
</script></body></html>
